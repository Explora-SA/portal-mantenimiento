<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Equipo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6f9;min-height:100vh;color:#1a1a2e}
  .header{background:#1a1a2e;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
  .header img{height:32px;width:auto;object-fit:contain}
  .header-title{color:#fff;font-size:15px;font-weight:600;opacity:.8}
  .container{max-width:600px;margin:0 auto;padding:20px 16px 40px}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
  .card-top{padding:20px 20px 16px;border-bottom:1px solid #f0f0f0}
  .tag-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:4px}
  .tag-value{font-size:26px;font-weight:900;letter-spacing:2px;color:#1a1a2e;font-family:'Courier New',monospace}
  .desc-value{font-size:15px;color:#444;margin-top:6px;line-height:1.4}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid}
  .badge-A{background:#fee2e2;color:#dc2626;border-color:#fecaca}
  .badge-B{background:#fef9c3;color:#ca8a04;border-color:#fde68a}
  .badge-C{background:#dcfce7;color:#16a34a;border-color:#bbf7d0}
  .badge-estado{background:#dbeafe;color:#1d6fa4;border-color:#bfdbfe}
  .badge-neutral{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb}
  .fields{padding:4px 0}
  .field-row{display:flex;align-items:flex-start;padding:12px 20px;border-bottom:1px solid #f5f5f5;gap:12px}
  .field-row:last-child{border-bottom:none}
  .field-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;margin-top:1px}
  .field-content{flex:1}
  .field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#aaa;margin-bottom:2px}
  .field-value{font-size:14px;color:#222;line-height:1.5}
  .field-value.mono{font-family:'Courier New',monospace;font-size:13px}
  .field-value.multiline{white-space:pre-wrap}
  .archivo-btn{display:inline-flex;align-items:center;gap:8px;background:#1a1a2e;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;margin:16px 20px;transition:opacity .2s}
  .archivo-btn:hover{opacity:.85}
  .loading{text-align:center;padding:60px 20px;color:#888;font-size:15px}
  .error-card{background:#fee2e2;border:1px solid #fecaca;border-radius:12px;padding:24px;text-align:center;color:#dc2626;font-size:14px;margin-top:20px}
  .inspeccion-tag{display:inline-flex;align-items:center;gap:6px;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:600}
  .inspeccion-tag.vencida{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
</style>
</head>

<script>
var VENC_URL = 'https://script.google.com/macros/s/AKfycbxBBiJZexMdWlGFDWKnIaPiOmSACB9RL1G-w03amZYBBwIw4AUWl59WzIdZoyqNrtiXvg/exec';
// El ID del activo es inyectado por Apps Script al servir la página
var ACTIVO_ID = '<?= activoId ?>';

function badge(text,cls){return '<span class="badge '+cls+'">'+text+'</span>';}
function criticidadBadge(c){
  if(!c)return '';
  var cls=c==='A'?'badge-A':c==='B'?'badge-B':c==='C'?'badge-C':'badge-neutral';
  var label=c==='A'?'Criticidad A — Alta':c==='B'?'Criticidad B — Media':c==='C'?'Criticidad C — Baja':'Criticidad '+c;
  return badge(label,cls);
}
function estadoBadge(e){if(!e)return '';return badge(e,'badge-estado');}
function fieldRow(icon,label,value,extra){
  if(!value&&value!==0)return '';
  return '<div class="field-row">'+
    '<div class="field-icon">'+icon+'</div>'+
    '<div class="field-content">'+
      '<div class="field-label">'+label+'</div>'+
      '<div class="field-value '+(extra||'')+'">'+value+'</div>'+
    '</div></div>';
}
function formatFecha(val){
  if(!val)return '';
  var m=String(val).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m)return m[3]+'/'+m[2]+'/'+m[1];
  return val;
}
function inspFechaHTML(val){
  if(!val)return '';
  var fecha=formatFecha(val);
  var d=new Date(val);
  var diff=(new Date()-d)/(1000*60*60*24);
  var cls=diff>90?'vencida':'';
  var ico=diff>90?'⚠️':'✅';
  return '<span class="inspeccion-tag '+cls+'">'+ico+' '+fecha+'</span>';
}
function renderActivo(r){
  var tag=r.tag||'-';
  var desc=r.descripcion||'';
  var html='<div class="card"><div class="card-top">';
  html+='<div class="tag-label">TAG del equipo</div>';
  html+='<div class="tag-value">'+tag+'</div>';
  if(desc)html+='<div class="desc-value">'+desc+'</div>';
  html+='<div class="badges">'+criticidadBadge(r.criticidad||'')+estadoBadge(r.estado||'')+'</div>';
  html+='</div><div class="fields">';
  html+=fieldRow('📍','Área / Subárea',[r.area,r.subarea].filter(Boolean).join(' › '));
  html+=fieldRow('🔧','Tipo de equipo',r.tipo||'');
  html+=fieldRow('🏭','Proveedor / Modelo',r.proveedor_modelo||r.proveedor||'');
  html+=fieldRow('📐','P&ID',r.p_id||r['p&id']||r.pid||'','mono');
  html+=fieldRow('⚠️','Modo de falla principal',r.modo_de_falla||r.modo_falla||'');
  var ultInsp=r.ultima_inspeccion||r['ultima_inspeccion']||'';
  if(ultInsp){
    html+='<div class="field-row"><div class="field-icon">🗓</div><div class="field-content"><div class="field-label">Última inspección</div><div class="field-value">'+inspFechaHTML(ultInsp)+'</div></div></div>';
  }
  html+=fieldRow('🔩','Repuestos críticos',r.repuestos_criticos||r['repuestos_criticos']||'','multiline');
  html+=fieldRow('📝','Observaciones técnicas',r.observaciones_tecnicas||r.observaciones||'','multiline');
  html+='</div>';
  var archivo=r.archivo||r.archivo_url||'';
  if(archivo)html+='<a href="'+archivo+'" target="_blank" class="archivo-btn">📎 Ver manual / documento técnico</a>';
  html+='</div>';
  return html;
}
function init(){
  var activoId=ACTIVO_ID;
  if(!activoId||activoId==='<?= activoId ?>'){
    document.getElementById('content').innerHTML='<div class="error-card">❌ No se especificó ningún equipo. Escaneá el código QR del equipo.</div>';
    return;
  }
  fetch(VENC_URL+'?action=getActivos')
    .then(function(r){return r.json();})
    .then(function(data){
      var activos=Array.isArray(data)?data:(data.activos||[]);
      var r=activos.find(function(a){
        return String(a.id)==String(activoId)||String(a.tag)==String(activoId);
      });
      if(!r){
        document.getElementById('content').innerHTML='<div class="error-card">❌ No se encontró el equipo: <strong>'+activoId+'</strong></div>';
        return;
      }
      document.title=(r.tag||'Ficha')+' — Ficha de Equipo';
      document.getElementById('content').innerHTML=renderActivo(r);
    })
    .catch(function(){
      document.getElementById('content').innerHTML='<div class="error-card">❌ Error al conectar con la base de datos.</div>';
    });
}
init();
</script>
</body>
</html>
