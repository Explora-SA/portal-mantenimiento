<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;min-height:100vh}

/* HEADER */
header{background:linear-gradient(135deg,#161b22,#1c2333);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d;position:sticky;top:0;z-index:100}
header h1{font-size:0.9rem;font-weight:700;color:#e6edf3}
.sub{font-size:0.62rem;color:#8b949e;margin-bottom:2px}
.hdr-right{font-size:0.65rem;color:#3fb950;font-weight:600}

/* MODULE BAR */
.mod-bar{display:flex;overflow-x:auto;background:#161b22;border-bottom:1px solid #21262d;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mod-bar::-webkit-scrollbar{display:none}
.mod-btn{flex:0 0 auto;padding:10px 16px;font-size:0.78rem;font-weight:700;cursor:pointer;border:none;border-bottom:3px solid transparent;color:#8b949e;background:transparent;white-space:nowrap}
.mod-btn.active{border-bottom-color:var(--accent);color:var(--accent)}
:root{--accent:#f97316}

/* MODULES */
.module{display:none;padding:12px 14px;padding-bottom:80px}
.module.active{display:block}

/* FIELDS */
.field{margin-bottom:12px}
.field label{display:block;font-size:0.68rem;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:600}
.field select,.field input{width:100%;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:11px 14px;border-radius:8px;font-size:0.9rem;outline:none;min-height:46px;-webkit-appearance:none}
.field select:focus,.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:#484f58}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row3 select{padding:11px 6px;font-size:0.82rem}

/* CARDS */
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:12px}
.card-title{font-size:0.78rem;font-weight:700;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}

/* TABLA MOTORES / INST */
.motor-row{background:#1c2333;border:1px solid #21262d;border-radius:8px;padding:10px;margin-bottom:8px}
.motor-tag{font-size:0.82rem;font-weight:700;color:#e6edf3;margin-bottom:8px;font-family:monospace}
.insp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.insp-item label{font-size:0.62rem;color:#8b949e;display:block;margin-bottom:3px}
.insp-item select{width:100%;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;-webkit-appearance:none}
.insp-item select.val-ok{background:#1a3a1a;border-color:#3fb95066;color:#3fb950}
.insp-item select.val-mal{background:#3a1a1a;border-color:#ea433566;color:#ea4335}
.insp-item select.val-urg{background:#4a0f0f;border-color:#ea4335;color:#ff6b6b}
.insp-item select.val-fs{background:#3a3000;border-color:#e3b34166;color:#e3b341}
.insp-obs{margin-top:6px}
.insp-obs input{width:100%;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none}

/* GENERADOR / UPS items */
.gen-item{background:#1c2333;border:1px solid #21262d;border-radius:8px;padding:10px;margin-bottom:8px}
.gen-item label{font-size:0.75rem;color:#c9d1d9;display:block;margin-bottom:6px;font-weight:600}
.gen-item input{width:100%;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:8px 10px;border-radius:6px;font-size:0.85rem;outline:none;margin-bottom:4px}
.gen-obs{width:100%;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none}
.gen-obs::placeholder{color:#484f58}

/* UPS */
.ups-section{background:#1c2333;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:12px}
.ups-title{font-size:0.85rem;font-weight:700;color:#e11d48;margin-bottom:10px}

/* TERMOGRAFIA */
.tablero-block{background:#1c2333;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:12px}
.tablero-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:6px}
.tablero-title{font-size:0.85rem;font-weight:700;color:#f97316}
.tablero-sub{font-size:0.65rem;color:#8b949e;margin-top:2px}
.tablero-actions{display:flex;gap:5px;flex-shrink:0}
.btn-sm{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:0.75rem;font-weight:700;border:none;min-height:36px}
.btn-sm-orange{background:#f97316;color:#0d1117}
.btn-sm-dark{background:#21262d;border:1px solid #30363d;color:#e6edf3}
.btn-sm-dark.con-foto{border-color:#3fb950;color:#3fb950}
.tab-msg{font-size:0.72rem;min-height:16px;margin-top:4px}
.fase-row{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:9px 10px;margin-bottom:6px}
.fase-nombre{font-size:0.72rem;font-weight:600;color:#8b949e;text-transform:uppercase;margin-bottom:7px}
.est-btns{display:flex;gap:5px}
.est-btn{flex:1;padding:8px 2px;border-radius:8px;font-size:0.75rem;font-weight:700;cursor:pointer;border:2px solid transparent;opacity:.35;text-align:center;min-height:38px}
.est-btn:active{transform:scale(0.94)}
.est-btn.sel{opacity:1}
.est-btn.AT{background:#3d1f1f;color:#f85149;border-color:#f85149}
.est-btn.MT{background:#3d3000;color:#e3b341;border-color:#e3b341}
.est-btn.BT{background:#1f4035;color:#3fb950;border-color:#3fb950}
.est-btn.NA{background:#1a2f4a;color:#58a6ff;border-color:#58a6ff}
.est-btn.PARADO{background:#21262d;color:#8b949e;border-color:#484f58}
.foto-preview-mini{margin-top:6px;display:none;align-items:center;gap:8px}
.foto-preview-mini img{max-height:60px;border-radius:6px;border:1px solid #30363d}
.btn-quitar-mini{background:none;border:none;color:#f85149;font-size:0.7rem;cursor:pointer;text-decoration:underline}

/* FOOTER FIJO */
.sticky-footer{position:fixed;bottom:0;left:0;right:0;background:#0d1117;border-top:1px solid #21262d;padding:10px 14px;display:flex;gap:8px;z-index:50}
.btn-limpiar{flex:1;background:#21262d;border:1px solid #30363d;color:#8b949e;padding:13px;border-radius:10px;cursor:pointer;font-size:0.85rem;min-height:48px}
.btn-guardar{flex:2;background:var(--accent);border:none;color:#0d1117;padding:13px;border-radius:10px;cursor:pointer;font-size:0.88rem;font-weight:700;min-height:48px}
.btn-guardar:active{transform:scale(0.97)}
.btn-guardar-todo{flex:2;background:#238636;border:none;color:#fff;padding:13px;border-radius:10px;cursor:pointer;font-size:0.88rem;font-weight:700;min-height:48px}

/* MSG */
.msg-bar{font-size:0.8rem;text-align:center;padding:6px 14px;min-height:28px}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:12px}
.spinner{width:36px;height:36px;border:3px solid #30363d;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.no-data{color:#8b949e;text-align:center;padding:24px;font-size:.82rem}
.semana-info{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:11px 14px;font-size:0.88rem;color:#8b5cf6;font-weight:700;min-height:46px;display:flex;align-items:center}

/* INSTALL BANNER */
.install-banner{display:none;background:#1c2333;border-bottom:1px solid #30363d;padding:8px 14px;align-items:center;justify-content:space-between;gap:8px}
.install-banner.show{display:flex}
.install-banner span{font-size:0.75rem;color:#e6edf3}
.btn-install{background:var(--accent);border:none;color:#0d1117;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.75rem;font-weight:700}
.btn-install-close{background:none;border:none;color:#8b949e;cursor:pointer;font-size:1rem}
</style>
</head>

<script>
// ══ URLs ══
const URL_TERMO  = "https://script.google.com/macros/s/AKfycbyYwTE2rwciQTH-zRX1XIr1uY-0jydP-QzScSqypY0zGuNMkxtOyDN2dumJcwxTbVa8/exec";
const URL_MOTORES= "https://script.google.com/macros/s/AKfycbyQFDz8Iu-d8VbcvFA1oDD4bJSUZcxk9UBQmNoaeIfFZPhhCgjY8TfcU23qwc3LCNO4NA/exec";
const URL_INST   = "https://script.google.com/macros/s/AKfycbzeTpVTJLQsTPz7rliOTCCGe93aoTJWuc0hLq9n--H0CQmFsBqEvvA5iAARJ9aZbfal/exec";
const URL_GEN    = "https://script.google.com/macros/s/AKfycbzXtAdtux9Cak7OXdl9MWb5m7c0CG2PeEmfIY99xJhWLX4cnG0OLet59Z3k-aS0hmBDsQ/exec";
const URL_UPS    = "https://script.google.com/macros/s/AKfycbwzyC0PKWOEQ9zvO6AJEzqYoilsQaW7gAJthjaYcENpHWywi0Vb6PfKaqy5GHtRGd__/exec";

const MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// ══ PWA ══
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install-banner').classList.add('show');});
document.getElementById('btn-install').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install-banner').classList.remove('show');});

// ══ Reloj ══
setInterval(()=>document.getElementById('hdr-time').textContent=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),1000);

// ══ Switch módulo ══
const modAccents={termo:'#f97316',motores:'#22c55e',inst:'#38bdf8',gen:'#8b5cf6',ups:'#e11d48',ilum:'#ca8a04'};
function switchMod(mod){
  document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
  document.querySelectorAll('.mod-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('mod-'+mod).classList.add('active');
  document.getElementById('mbtn-'+mod).classList.add('active');
  document.documentElement.style.setProperty('--accent',modAccents[mod]);
  // Cargar datos si es primera vez
  if(mod==='ups' && !uCargado) uRenderTabla();
  if(mod==='gen' && !gCargado) gRenderTabla();
}

function colorSelect(sel){
  sel.className='';
  const v=sel.value.toUpperCase();
  if(v==='OK')sel.className='val-ok';
  else if(v==='MAL')sel.className='val-mal';
  else if(v==='URG')sel.className='val-urg';
  else if(v==='F/S')sel.className='val-fs';
}

// ════════════════════════════════════
// TERMOGRAFÍA
// ════════════════════════════════════
let tSectoresData={}, tCargaEstado={}, tOrdenTags=[], tFotoTagActual=null;
const T_ESTADOS=['BT','MT','AT','N/A','PARADO'];
const T_CLS={BT:'BT',MT:'MT',AT:'AT','N/A':'NA',PARADO:'PARADO'};

// Foto
document.getElementById('foto-camara').addEventListener('change',function(){tOnFoto(this);});
document.getElementById('foto-archivo').addEventListener('change',function(){tOnFoto(this);});
function tAbrirCamara(tag){tFotoTagActual=tag;document.getElementById('foto-camara').click();}
function tAbrirArchivo(tag){tFotoTagActual=tag;document.getElementById('foto-archivo').click();}
function tOnFoto(input){
  const file=input.files[0];if(!file||!tFotoTagActual)return;
  const tag=tFotoTagActual;
  const reader=new FileReader();
  reader.onload=e=>{tCargaEstado[tag].fotoBase64=e.target.result.split(',')[1];tCargaEstado[tag].fotoNombre=file.name;tCargaEstado[tag].fotoMime=file.type;tRender();};
  reader.readAsDataURL(file);input.value='';tFotoTagActual=null;
}
function tQuitarFoto(tag){tCargaEstado[tag].fotoBase64=null;tCargaEstado[tag].fotoNombre=null;tCargaEstado[tag].fotoMime=null;tRender();}

async function tLoadSectores(){
  try{
    const r=await fetch(URL_TERMO+'?action=tags');
    const data=await r.json();
    tSectoresData={};
    data.forEach(({sector,tag})=>{if(!tSectoresData[sector])tSectoresData[sector]=[];if(!tSectoresData[sector].includes(tag))tSectoresData[sector].push(tag);});
    const ss=document.getElementById('t-sector');
    Object.keys(tSectoresData).sort().forEach(s=>ss.innerHTML+=`<option value="${s}">${s}</option>`);
    const dia=document.getElementById('t-dia');
    for(let i=1;i<=31;i++)dia.innerHTML+=`<option value="${String(i).padStart(2,'0')}">${i}</option>`;
    const hoy=new Date();
    dia.value=String(hoy.getDate()).padStart(2,'0');
    document.getElementById('t-mes').value=String(hoy.getMonth()+1).padStart(2,'0');
    // Restaurar sector activo si había uno guardado
    const sectorGuardado=localStorage.getItem('termo_sector_activo');
    if(sectorGuardado){
      const sel=document.getElementById('t-sector');
      if([...sel.options].some(o=>o.value===sectorGuardado)){
        sel.value=sectorGuardado;
        await tOnSectorChange();
      }
    }
  }catch(e){document.getElementById('t-container').innerHTML=`<div class="no-data">❌ Error cargando sectores</div>`;}
}

async function tOnSectorChange(){
  const sector=document.getElementById('t-sector').value;
  const sectorAnterior=localStorage.getItem('termo_sector_activo')||'';
  if(sectorAnterior && sectorAnterior!==sector){tClearLocal(sectorAnterior);}
  tCargaEstado={};
  tOrdenTags=[];
  if(sector)localStorage.setItem('termo_sector_activo',sector);
  const container=document.getElementById('t-container');
  const footer=document.getElementById('t-footer');
  document.getElementById('t-msg').textContent='';
  if(!sector){container.innerHTML='<div class="no-data">Seleccioná un sector.</div>';footer.style.display='none';return;}
  const tags=(tSectoresData[sector]||[]).slice();
  tOrdenTags=tags.slice();
  if(!tags.length){container.innerHTML='<div class="no-data">Sin tableros.</div>';footer.style.display='none';return;}
  container.innerHTML='<div class="loading"><div class="spinner"></div><div style="color:#8b949e;font-size:.82rem">Cargando fases...</div></div>';
  await Promise.all(tags.map(async tag=>{
    try{const r=await fetch(URL_TERMO+'?action=fases&tag='+encodeURIComponent(tag));const fases=await r.json();tCargaEstado[tag]={fases,valores:{},observacion:'',fotoBase64:null,fotoNombre:null,fotoMime:null};}
    catch(e){tCargaEstado[tag]={fases:[],valores:{},fotoBase64:null,fotoNombre:null,fotoMime:null};}
  }));
  tLoadLocal();
  tRender();
  footer.style.display='block';
}

function tRender(){
  const container=document.getElementById('t-container');
  const tags=tOrdenTags.length?tOrdenTags:Object.keys(tCargaEstado);
  container.innerHTML=tags.map(tag=>{
    const {fases,valores,fotoBase64,fotoNombre}=tCargaEstado[tag];
    const cargados=Object.keys(valores).length;
    const tagId=tag.replace(/[^a-zA-Z0-9]/g,'_');
    const fotoPreview=fotoBase64?`<div class="foto-preview-mini" style="display:flex"><img src="data:image/jpeg;base64,${fotoBase64}"><div><div style="font-size:.65rem;color:#c9d1d9">${fotoNombre}</div><button class="btn-quitar-mini" onclick="tQuitarFoto('${tag}')">✕ Quitar</button></div></div>`:'';
    const obsVal=(tCargaEstado[tag].observacion||'').replace(/'/g,"&#39;");
    const obsHtml=`<div style="margin-top:8px"><input type="text" placeholder="Observación..." value="${obsVal}" onchange="tSetObs('${tag}',this.value)" style="width:100%;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:8px 10px;border-radius:7px;font-size:0.82rem;outline:none"></div>`;
    const fasesHtml=fases.length?`<div style="margin-top:8px">${fases.map(fase=>{const sel=valores[fase]||null;return`<div class="fase-row"><div class="fase-nombre">${fase}</div><div class="est-btns">${T_ESTADOS.map(e=>`<button class="est-btn ${T_CLS[e]}${sel===e?' sel':''}" onclick="tSetFase('${tag}','${fase}','${e}')">${e}</button>`).join('')}</div></div>`;}).join('')}</div>`:'<div class="no-data" style="padding:8px;font-size:.78rem">Sin fases.</div>';
    if(tCargaEstado[tag]&&tCargaEstado[tag].guardado){
      return`<div class="tablero-block" style="opacity:.5;background:#1a3a1a;border-color:#3fb95066"><div class="tablero-header"><div><div class="tablero-title" style="color:#3fb950">✅ ${tag} — Guardado</div></div><div class="tablero-actions"><button class="btn-sm btn-sm-dark" onclick="tDescolapsar('${tag}')">↩</button></div></div></div>`;
    }
    return`<div class="tablero-block"><div class="tablero-header"><div><div class="tablero-title">⚡ ${tag}</div><div class="tablero-sub">${cargados}/${fases.length} fases</div></div><div class="tablero-actions"><button class="btn-sm btn-sm-dark" onclick="tLimpiarTablero('${tag}')">🗑</button><button class="btn-sm btn-sm-dark ${fotoBase64?'con-foto':''}" onclick="tAbrirCamara('${tag}')">📷</button><button class="btn-sm btn-sm-dark ${fotoBase64?'con-foto':''}" onclick="tAbrirArchivo('${tag}')">📎</button><button class="btn-sm btn-sm-orange" onclick="tGuardarTablero('${tag}')">💾</button></div></div><div class="tab-msg" id="tmsg-${tagId}"></div>${fotoPreview}${obsHtml}${fasesHtml}</div>`;
  }).join('');
}

function tSetObs(tag,val){if(tCargaEstado[tag])tCargaEstado[tag].observacion=val;tSaveLocal();}
function tSetFase(tag,fase,estado){
  if(!tCargaEstado[tag])return;
  if(estado==='PARADO'){
    (tCargaEstado[tag].fases||[]).forEach(function(f){tCargaEstado[tag].valores[f]='PARADO';});
  } else {
    tCargaEstado[tag].valores[fase]=estado;
  }
  tRender();
}

function tGetFecha(){return document.getElementById('t-dia').value+'/'+document.getElementById('t-mes').value+'/'+document.getElementById('t-anio').value;}

async function tGuardarTablero(tag){
  const sector=document.getElementById('t-sector').value;
  const tagId=tag.replace(/[^a-zA-Z0-9]/g,'_');
  const msgEl=document.getElementById('tmsg-'+tagId);
  const est=tCargaEstado[tag];
  if(!Object.keys(est.valores).length){msgEl.style.color='#f85149';msgEl.textContent='❌ Sin fases';return;}
  const fila={FECHA:tGetFecha(),SECTOR:sector,TAG:tag,...est.valores,OBSERVACIONES:est.observacion||''};
  if(est.fotoBase64){fila._fotoBase64=est.fotoBase64;fila._fotoNombre=est.fotoNombre;fila._fotoMime=est.fotoMime;}
  msgEl.style.color='#8b949e';msgEl.textContent='Guardando...';
  try{
    const r=await fetch(URL_TERMO,{method:'POST',body:JSON.stringify({filas:[fila]})});
    const res=await r.json();
    if(res.ok){msgEl.style.color='#3fb950';msgEl.textContent='✅ Guardado';tCargaEstado[tag].valores={};tCargaEstado[tag].fotoBase64=null;tCargaEstado[tag].fotoNombre=null;tCargaEstado[tag].fotoMime=null;tCargaEstado[tag].guardado=true;tSaveLocal();tRender();}
    else{msgEl.style.color='#f85149';msgEl.textContent='❌ '+res.error;}
  }catch(e){msgEl.style.color='#f85149';msgEl.textContent='❌ Error';}
}

async function tGuardarTodo(){
  const sector=document.getElementById('t-sector').value;
  const msg=document.getElementById('t-msg');
  const tags=Object.keys(tCargaEstado).filter(tag=>Object.keys(tCargaEstado[tag].valores).length>0);
  if(!tags.length){msg.style.color='#f85149';msg.textContent='❌ Sin fases cargadas';return;}
  const filas=tags.map(tag=>{const est=tCargaEstado[tag];const fila={FECHA:tGetFecha(),SECTOR:sector,TAG:tag,...est.valores,OBSERVACIONES:est.observacion||''};if(est.fotoBase64){fila._fotoBase64=est.fotoBase64;fila._fotoNombre=est.fotoNombre;fila._fotoMime=est.fotoMime;}return fila;});
  msg.style.color='#8b949e';msg.textContent=`Guardando ${filas.length} tableros...`;
  try{
    const r=await fetch(URL_TERMO,{method:'POST',body:JSON.stringify({filas})});
    const res=await r.json();
    if(res.ok){msg.style.color='#3fb950';msg.textContent=`✅ ${res.guardadas} guardados`;tags.forEach(tag=>{tCargaEstado[tag].valores={};tCargaEstado[tag].fotoBase64=null;tCargaEstado[tag].fotoNombre=null;tCargaEstado[tag].fotoMime=null;});tRender();}
    else{msg.style.color='#f85149';msg.textContent='❌ '+res.error;}
  }catch(e){msg.style.color='#f85149';msg.textContent='❌ Error';}
}

function tDescolapsar(tag){if(tCargaEstado[tag])tCargaEstado[tag].guardado=false;tSaveLocal();tRender();}
function tLimpiarTablero(tag){if(!tCargaEstado[tag])return;tCargaEstado[tag].valores={};tCargaEstado[tag].fotoBase64=null;tCargaEstado[tag].fotoNombre=null;tCargaEstado[tag].fotoMime=null;tCargaEstado[tag].observacion='';tCargaEstado[tag].guardado=false;tSaveLocal();tRender();}
function tLimpiarTodo(){Object.keys(tCargaEstado).forEach(tag=>{tCargaEstado[tag].valores={};tCargaEstado[tag].fotoBase64=null;tCargaEstado[tag].fotoNombre=null;tCargaEstado[tag].fotoMime=null;});document.getElementById('t-msg').textContent='';tSaveLocal();tRender();}

const M_COLS=[{key:"cubierta_goma",label:"Cubierta Goma"},{key:"pulsadores",label:"Pulsadores"},{key:"nmotor",label:"N° Motor"},{key:"acom_motor",label:"Acom. Motor"},{key:"acom_caja",label:"Acom. Caja"},{key:"sell_fm",label:"Sell. FM"},{key:"sell_cmd",label:"Sell. Cmd"},{key:"pasta_fm",label:"Pasta FM"},{key:"pasta_cmd",label:"Pasta Cmd"},{key:"pat",label:"PAT"},{key:"limp_carcasa",label:"Limp. Carcasa"},{key:"vent_estado",label:"Vent. Estado"},{key:"vent_limpieza",label:"Vent. Limpieza"}];
let mMotoresCarga=[];

async function mCargarMotores(){
  const ruta=document.getElementById('m-ruta').value;
  const container=document.getElementById('m-container');
  if(!ruta){container.innerHTML='<div class="no-data">Seleccioná una ruta.</div>';return;}
  container.innerHTML='<div class="loading"><div class="spinner"></div><div style="color:#8b949e;font-size:.82rem">Cargando motores...</div></div>';
  try{
    const r=await fetch(URL_MOTORES+'?action=detalle&ruta='+encodeURIComponent(ruta));
    const data=await r.json();
    mMotoresCarga=(data.motores||[]).map(m=>({tag:m.tag,nmotor:m.nmotor}));
    mRenderMotores();
  }catch(e){container.innerHTML=`<div class="no-data">❌ Error cargando motores</div>`;}
}

function mRenderMotores(){
  const container=document.getElementById('m-container');
  if(!mMotoresCarga.length){container.innerHTML='<div class="no-data">Sin motores.</div>';return;}
  const opts=['','OK','MAL','URG','N/A','F/S'].map(v=>`<option value="${v}">${v||'--'}</option>`).join('');
  container.innerHTML=mMotoresCarga.map((m,i)=>`
    <div class="motor-row">
      <div class="motor-tag">${m.tag}</div>
      <div class="insp-grid">
        <div class="insp-item"><label>N° Motor</label><input id="m_nm_${i}" value="${m.nmotor||''}" placeholder="N°" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;width:100%"></div>
        ${M_COLS.filter(c=>c.key!=='nmotor').map(c=>`<div class="insp-item"><label>${c.label}</label><select id="m_${c.key}_${i}" onchange="colorSelect(this)">${opts}</select></div>`).join('')}
      </div>
      <div class="insp-obs"><input id="m_obs_${i}" placeholder="Observaciones..." style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;width:100%"></div>
    </div>`).join('');
}

async function mGuardar(){
  const ruta=document.getElementById('m-ruta').value;
  const realizo=document.getElementById('m-realizo').value.trim();
  const fecha=document.getElementById('m-fecha').value;
  const ot=document.getElementById('m-ot').value.trim();
  const msg=document.getElementById('m-msg');
  if(!ruta||!realizo||!fecha){msg.style.color='#f85149';msg.textContent='❌ Completá ruta, realizó y fecha';return;}
  if(!mMotoresCarga.length){msg.style.color='#f85149';msg.textContent='❌ Sin motores cargados';return;}
  const motores=mMotoresCarga.map((m,i)=>{
    const obj={tag:m.tag,nmotor:document.getElementById('m_nm_'+i).value.trim()};
    M_COLS.filter(c=>c.key!=='nmotor').forEach(c=>{obj[c.key]=document.getElementById('m_'+c.key+'_'+i).value;});
    obj.observaciones=document.getElementById('m_obs_'+i).value.trim();
    return obj;
  });
  msg.style.color='#8b949e';msg.textContent='Guardando...';
  try{
    const r=await fetch(URL_MOTORES,{method:'POST',body:JSON.stringify({action:'guardar',ruta,realizado:realizo,fecha,ot,motores})});
    const res=await r.json();
    if(res.ok){msg.style.color='#3fb950';msg.textContent='✅ Guardado en "'+res.hoja+'"';}
    else{msg.style.color='#f85149';msg.textContent='❌ '+res.error;}
  }catch(e){msg.style.color='#f85149';msg.textContent='❌ Error de conexión';}
}

function mLimpiar(){document.getElementById('m-ruta').value='';document.getElementById('m-realizo').value='';document.getElementById('m-fecha').value='';document.getElementById('m-ot').value='';document.getElementById('m-container').innerHTML='<div class="no-data">Seleccioná una ruta.</div>';document.getElementById('m-msg').textContent='';mMotoresCarga=[];}

const G_ITEMS=["Nivel Aceite","Nivel Refrigerante","Nivel agua destilada Batería norte","Nivel agua destilada Batería sur","Limpieza bornes baterías norte","Limpieza bornes baterías sur","Tensión baterías norte","Tensión baterías sur","Horas de funcionamiento","Concentración de ácido","Estado correas","Estado radiador","Filtros de aire","Pérdidas de aceite","Pérdidas de refrigerante","Pérdidas de combustible","Limpieza general"];
let gCargado=false;

function gGetSemana(dia){if(dia<=7)return 1;if(dia<=14)return 2;if(dia<=21)return 3;if(dia<=28)return 4;return 5;}

function gAutoSemana(){
  const fechaStr=document.getElementById('g-fecha').value;
  const info=document.getElementById('g-semana-info');
  if(!fechaStr){info.textContent='— seleccioná una fecha';return;}
  const fecha=new Date(fechaStr+'T12:00:00');
  info.textContent='Semana '+gGetSemana(fecha.getDate())+' — '+MESES_ES[fecha.getMonth()]+' '+fecha.getFullYear();
  if(!gCargado){gRenderTabla();gCargado=true;}
}

function gRenderTabla(){
  document.getElementById('g-container').innerHTML=G_ITEMS.map((item,i)=>`
    <div class="gen-item">
      <label>${item}</label>
      <input id="g_est_${i}" placeholder="valor / estado...">
      <input id="g_obs_${i}" placeholder="Observaciones..." class="gen-obs">
    </div>`).join('');
  gCargado=true;
}

async function gGuardar(){
  const fecha=document.getElementById('g-fecha').value;
  const ejecutante=document.getElementById('g-ejecutante').value.trim();
  const msg=document.getElementById('g-msg');
  if(!fecha||!ejecutante){msg.style.color='#f85149';msg.textContent='❌ Completá fecha y ejecutante';return;}
  const fechaObj=new Date(fecha+'T12:00:00');
  const hoja=MESES_ES[fechaObj.getMonth()]+' '+fechaObj.getFullYear();
  const semana=gGetSemana(fechaObj.getDate());
  const items=G_ITEMS.map((nombre,i)=>({nombre,estado:document.getElementById('g_est_'+i)?document.getElementById('g_est_'+i).value.trim():'',observaciones:document.getElementById('g_obs_'+i)?document.getElementById('g_obs_'+i).value.trim():''}));
  const obsGen='';
  msg.style.color='#8b949e';msg.textContent='Guardando...';
  try{
    const r=await fetch(URL_GEN,{method:'POST',body:JSON.stringify({action:'guardar',hoja,semana:parseInt(semana),fecha,ejecutante,items,observaciones_generales:obsGen})});
    const res=await r.json();
    if(res.ok){msg.style.color='#3fb950';msg.textContent='✅ Guardado — '+res.hoja+' Semana '+res.semana;}
    else{msg.style.color='#f85149';msg.textContent='❌ '+res.error;}
  }catch(e){msg.style.color='#f85149';msg.textContent='❌ Error de conexión';}
}

function gLimpiar(){document.getElementById('g-fecha').value='';document.getElementById('g-ejecutante').value='';document.getElementById('g-semana-info').textContent='— seleccioná una fecha';document.getElementById('g-msg').textContent='';gCargado=false;gRenderTabla();}

const UPS_IDS=["UPS 1","UPS 2","UPS 3","UPS 4","UPS 5","UPS 6","UPS 12"];
const UPS_ITEMS=["Fallo","Modo Normal","Modo Bypass","Modo Baterías","Consumo Carga [%]","Tensión Baterías [V]","Tensión Salida [V]","Limpieza General"];
let uCargado=false;

function uRenderTabla(){
  document.getElementById('u-container').innerHTML=UPS_IDS.map((upsId,ui)=>`
    <div class="ups-section">
      <div class="ups-title">${upsId}</div>
      ${UPS_ITEMS.map((item,i)=>`
        <div class="gen-item">
          <label>${item}</label>
          <input id="u_est_${ui}_${i}" placeholder="valor / estado...">
          <input id="u_obs_${ui}_${i}" placeholder="Observaciones..." class="gen-obs">
        </div>`).join('')}
    </div>`).join('');
  uCargado=true;
}

// Mostrar tabla cuando se completa fecha o ejecutante
['u-fecha','u-ejecutante'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{
    const fecha=document.getElementById('u-fecha').value;
    const ejecutante=document.getElementById('u-ejecutante').value.trim();
    if(fecha&&ejecutante&&!uCargado){uRenderTabla();}
  });
});

async function uGuardar(){
  const fecha=document.getElementById('u-fecha').value;
  const ejecutante=document.getElementById('u-ejecutante').value.trim();
  const msg=document.getElementById('u-msg');
  if(!fecha||!ejecutante){msg.style.color='#f85149';msg.textContent='❌ Completá fecha y ejecutante';return;}
  const fechaObj=new Date(fecha+'T12:00:00');
  const hoja=MESES_ES[fechaObj.getMonth()]+' '+fechaObj.getFullYear();
  const ups=UPS_IDS.map((upsId,ui)=>{
    const items=UPS_ITEMS.map((nombre,i)=>({nombre,estado:document.getElementById('u_est_'+ui+'_'+i)?document.getElementById('u_est_'+ui+'_'+i).value.trim():'',obs:document.getElementById('u_obs_'+ui+'_'+i)?document.getElementById('u_obs_'+ui+'_'+i).value.trim():''}));
    return{id:upsId,items};
  });
  msg.style.color='#8b949e';msg.textContent='Guardando...';
  try{
    const r=await fetch(URL_UPS,{method:'POST',body:JSON.stringify({action:'guardar',hoja,fecha,ejecutante,ups})});
    const res=await r.json();
    if(res.ok){msg.style.color='#3fb950';msg.textContent='✅ Guardado en "'+res.hoja+'"';}
    else{msg.style.color='#f85149';msg.textContent='❌ '+res.error;}
  }catch(e){msg.style.color='#f85149';msg.textContent='❌ Error de conexión';}
}

function uLimpiar(){document.getElementById('u-fecha').value='';document.getElementById('u-ejecutante').value='';document.getElementById('u-msg').textContent='';uCargado=false;uRenderTabla();}

const ILUM_MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let ilumEquiposCarga=[];

async function ilumCargarEquipos(){
  const ruta=document.getElementById('ilum-ruta').value;
  const container=document.getElementById('ilum-container');
  if(!ruta){container.innerHTML='<div class="no-data">Seleccioná una ruta.</div>';return;}
  const sheetId=ILUM_SHEETS[ruta];
  if(!sheetId){container.innerHTML='<div class="no-data">❌ Ruta no encontrada.</div>';return;}
  container.innerHTML='<div class="loading"><div class="spinner"></div><div style="color:#8b949e;font-size:.82rem">Cargando equipos...</div></div>';
  try{
    const r=await fetch(URL_ILUM+'?action=equipos&sheetId='+encodeURIComponent(sheetId));
    const data=await r.json();
    ilumEquiposCarga=(data.equipos||[]);
    ilumRenderEquipos();
  }catch(e){container.innerHTML='<div class="no-data">❌ Error cargando equipos</div>';}
}

function ilumRenderEquipos(){
  const container=document.getElementById('ilum-container');
  if(!ilumEquiposCarga.length){container.innerHTML='<div class="no-data">Sin equipos.</div>';return;}
  const opts=['','OK','MAL','URG','N/A','F/S'].map(v=>`<option value="${v}">${v||'--'}</option>`).join('');
  // Agrupar por sección
  const secciones={};
  ilumEquiposCarga.forEach((e,i)=>{const s=e.seccion||'General';if(!secciones[s])secciones[s]=[];secciones[s].push({...e,_idx:i});});
  let html='';
  Object.keys(secciones).forEach(sec=>{
    html+=`<div class="card"><div class="card-title">📍 ${sec}</div>`;
    secciones[sec].forEach(e=>{
      const i=e._idx;
      html+=`<div class="motor-row">
        <div class="motor-tag">${e.tag||e.ubicacion||'Equipo '+(i+1)}</div>
        ${e.ubicacion?`<div style="font-size:.72rem;color:#8b949e;margin-bottom:6px">${e.ubicacion}</div>`:''}
        <div class="insp-grid">
          <div class="insp-item"><label>Circuito</label><input id="ilum_cir_${i}" value="${e.circuito||''}" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;width:100%"></div>
          <div class="insp-item"><label>Potencia</label><input id="ilum_pot_${i}" value="${e.potencia||''}" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;width:100%"></div>
          <div class="insp-item"><label>Tipo</label><input id="ilum_tip_${i}" value="${e.tipo||''}" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;width:100%"></div>
          <div class="insp-item"><label>Lámpara</label><input id="ilum_lam_${i}" value="${e.lampara||''}" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;width:100%"></div>
          <div class="insp-item"><label>Estado</label><select id="ilum_est_${i}" onchange="colorSelect(this)">${opts}</select></div>
        </div>
        <div class="insp-obs"><input id="ilum_obs_${i}" placeholder="Observaciones..." style="background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 8px;border-radius:6px;font-size:0.78rem;outline:none;width:100%"></div>
      </div>`;
    });
    html+='</div>';
  });
  container.innerHTML=html;
}

async function ilumGuardar(){
  const ruta=document.getElementById('ilum-ruta').value;
  const realizo=document.getElementById('ilum-realizo').value.trim();
  const fecha=document.getElementById('ilum-fecha').value;
  const ot=document.getElementById('ilum-ot').value.trim();
  const msg=document.getElementById('ilum-msg');
  if(!ruta||!realizo||!fecha){msg.style.color='#f85149';msg.textContent='❌ Completá ruta, realizó y fecha';return;}
  if(!ilumEquiposCarga.length){msg.style.color='#f85149';msg.textContent='❌ Sin equipos cargados';return;}
  const sheetId=ILUM_SHEETS[ruta];
  const fechaObj=new Date(fecha+'T12:00:00');
  const hoja=ILUM_MESES[fechaObj.getMonth()]+' '+fechaObj.getFullYear();
  const equipos=ilumEquiposCarga.map((e,i)=>({
    tag:e.tag||'',
    ubicacion:document.getElementById('ilum_cir_'+i)?document.getElementById('ilum_cir_'+i).value.trim():'',
    circuito:document.getElementById('ilum_cir_'+i)?document.getElementById('ilum_cir_'+i).value.trim():'',
    potencia:document.getElementById('ilum_pot_'+i)?document.getElementById('ilum_pot_'+i).value.trim():'',
    tipo:document.getElementById('ilum_tip_'+i)?document.getElementById('ilum_tip_'+i).value.trim():'',
    lampara:document.getElementById('ilum_lam_'+i)?document.getElementById('ilum_lam_'+i).value.trim():'',
    estado:document.getElementById('ilum_est_'+i)?document.getElementById('ilum_est_'+i).value:'',
    observaciones:document.getElementById('ilum_obs_'+i)?document.getElementById('ilum_obs_'+i).value.trim():''
  }));
  msg.style.color='#8b949e';msg.textContent='Guardando...';
  try{
    const r=await fetch(URL_ILUM,{method:'POST',body:JSON.stringify({action:'guardar',sheetId,ruta,realizado:realizo,fecha,ot,hoja,equipos})});
    const res=await r.json();
    if(res.ok){msg.style.color='#3fb950';msg.textContent='✅ Guardado en "'+res.hoja+'"';}
    else{msg.style.color='#f85149';msg.textContent='❌ '+(res.error||'Error');}
  }catch(e){msg.style.color='#f85149';msg.textContent='❌ Error de conexión';}
}

// ════ PERSISTENCIA LOCAL (termografia) ════
function tSaveLocal(){
  const sector=document.getElementById('t-sector').value;
  if(!sector)return;
  const key='termo_'+sector;
  const data={estado:{}};
  tOrdenTags.forEach(function(tag){
    if(tCargaEstado[tag]){
      data.estado[tag]={
        guardado:tCargaEstado[tag].guardado||false,
        valores:tCargaEstado[tag].valores||{},
        observacion:tCargaEstado[tag].observacion||''
      };
    }
  });
  try{localStorage.setItem(key,JSON.stringify(data));}catch(e){}
}
function tLoadLocal(){
  const sector=document.getElementById('t-sector').value;
  if(!sector)return;
  const key='termo_'+sector;
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(data.estado){
      Object.keys(data.estado).forEach(function(tag){
        if(tCargaEstado[tag]){
          tCargaEstado[tag].guardado=data.estado[tag].guardado||false;
          tCargaEstado[tag].valores=data.estado[tag].valores||{};
          tCargaEstado[tag].observacion=data.estado[tag].observacion||'';
        }
      });
    }
  }catch(e){}
}
function tClearLocal(sectorParam){
  const sector=sectorParam||document.getElementById('t-sector').value;
  if(!sector)return;
  try{localStorage.removeItem('termo_'+sector);}catch(e){}
}
